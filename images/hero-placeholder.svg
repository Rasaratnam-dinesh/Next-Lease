<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="White SUV on a light blue studio background" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9c9ee"/><stop offset=".55" stop-color="#cfe1f5"/><stop offset="1" stop-color="#e6f0fb"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#dbe8f7" stop-opacity=".9"/></linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#f6f8fb"/><stop offset=".72" stop-color="#e1e7ef"/><stop offset="1" stop-color="#b6c1d0"/></linearGradient>
    <linearGradient id="shadeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b8fb0" stop-opacity=".35"/><stop offset=".14" stop-color="#7b8fb0" stop-opacity="0"/><stop offset=".86" stop-color="#7b8fb0" stop-opacity="0"/><stop offset="1" stop-color="#5d7096" stop-opacity=".4"/></linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46607f"/><stop offset=".45" stop-color="#1b2739"/><stop offset="1" stop-color="#0a1019"/></linearGradient>
    <linearGradient id="cladG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4453"/><stop offset="1" stop-color="#121821"/></linearGradient>
    <radialGradient id="rimG" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#8794a7"/></radialGradient>
    <linearGradient id="spokeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a7b2c2"/></linearGradient>
    <linearGradient id="tailG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a6a"/><stop offset="1" stop-color="#8d0f1e"/></linearGradient>
    <linearGradient id="fadeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="fadeM" maskUnits="userSpaceOnUse" x="-20" y="219" width="680" height="110"><rect x="-20" y="219" width="680" height="110" fill="url(#fadeG)"/></mask>
    <filter id="blur6" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="bodyClip"><path id="bodyShape" d="M12,190C3,184 0,168 1,150C2,134 9,122 24,116C60,110 140,94 206,84C244,56 286,26 330,14C378,2 430,-1 470,5C520,13 566,42 598,68C610,78 616,94 616,112L618,170C618,186 612,196 598,198L24,198C18,198 14,196 12,190Z"/></clipPath>
    <g id="wheel">
      <circle r="47" fill="#11151c"/>
      <circle r="44" fill="none" stroke="#2a3340" stroke-width="3"/>
      <circle r="34" fill="#1b2230"/>
      <circle r="32" fill="url(#rimG)"/>
      <circle r="25" fill="#2b3340"/>
      <path d="M9,-23A25 25 0 0 1 23,-10L17,-5A18 18 0 0 0 8,-16Z" fill="#0b478a"/>
      <g fill="url(#spokeG)">
        <path d="M-5,-6L-8,-30Q0,-34 8,-30L5,-6Z"/>
        <path d="M-5,-6L-8,-30Q0,-34 8,-30L5,-6Z" transform="rotate(72)"/>
        <path d="M-5,-6L-8,-30Q0,-34 8,-30L5,-6Z" transform="rotate(144)"/>
        <path d="M-5,-6L-8,-30Q0,-34 8,-30L5,-6Z" transform="rotate(216)"/>
        <path d="M-5,-6L-8,-30Q0,-34 8,-30L5,-6Z" transform="rotate(288)"/>
      </g>
      <circle r="8" fill="#cfd6e0" stroke="#8d99aa" stroke-width="1.5"/>
      <circle r="32" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1"/>
    </g>
    <g id="car">
      <!-- body -->
      <use xlink:href="#bodyShape" fill="url(#bodyG)"/>
      <g clip-path="url(#bodyClip)">
        <rect x="0" y="0" width="620" height="200" fill="url(#shadeG)"/>
        <!-- lower cladding -->
        <path d="M12,174L612,174C618,178 620,184 620,190L620,200L10,200Z" fill="url(#cladG)"/>
        <path d="M14,174L610,174" stroke="#d3dbe6" stroke-width="2"/>
        <!-- character lines -->
        <path d="M20,124C150,106 330,100 520,100C560,100 590,102 614,108" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".95"/>
        <path d="M20,128C150,110 330,104 520,104C560,104 590,106 614,112" fill="none" stroke="#7b8fb0" stroke-opacity=".35" stroke-width="2"/>
        <path d="M30,154C200,142 420,142 614,148" fill="none" stroke="#7b8fb0" stroke-opacity=".3" stroke-width="2"/>
        <!-- door shut lines -->
        <g fill="none" stroke="#5f7192" stroke-opacity=".5" stroke-width="1.6">
          <path d="M212,96C216,130 220,160 224,174"/>
          <path d="M376,94C378,130 378,160 378,174"/>
          <path d="M530,92C534,130 536,160 538,176"/>
        </g>
        <!-- handles -->
        <rect x="318" y="104" width="30" height="7" rx="3.5" fill="#e3e8f0" stroke="#5f7192" stroke-opacity=".45"/>
        <rect x="436" y="102" width="30" height="7" rx="3.5" fill="#e3e8f0" stroke="#5f7192" stroke-opacity=".45"/>
        <!-- wheel wells -->
        <circle cx="118" cy="172" r="56" fill="#0d121a"/>
        <circle cx="494" cy="172" r="56" fill="#0d121a"/>
        <circle cx="118" cy="172" r="58" fill="none" stroke="#202a37" stroke-width="5"/>
        <circle cx="494" cy="172" r="58" fill="none" stroke="#202a37" stroke-width="5"/>
      </g>
      <!-- roof highlight -->
      <path d="M340,5C390,-2 440,-2 472,5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
      <!-- greenhouse -->
      <path d="M214,92C246,62 286,34 326,22C374,12 428,10 466,15C512,22 552,50 578,74C564,84 548,89 528,90L214,92Z" fill="url(#glassG)" stroke="#0a1019" stroke-width="2"/>
      <path d="M232,86C262,60 298,36 330,28L352,27L296,89Z" fill="#fff" opacity=".18"/>
      <path d="M404,14L438,14L398,91L368,91Z" fill="#fff" opacity=".12"/>
      <path d="M364,14L384,13L388,92L368,92Z" fill="url(#bodyG)" stroke="#0a1019" stroke-width="1.2"/>
      <path d="M214,93L530,91" stroke="#c9d1dc" stroke-width="2.2"/>
      <!-- mirror -->
      <path d="M212,90C218,80 236,77 248,82L246,93C236,95 222,95 212,93Z" fill="url(#bodyG)" stroke="#6f7f99" stroke-opacity=".6"/>
      <path d="M228,88L246,87L246,93C238,95 230,95 224,94Z" fill="#141b27"/>
      <!-- lights -->
      <path d="M10,130C20,120 44,114 80,114L75,122C52,122 30,127 14,138Z" fill="#111822"/>
      <path d="M17,129C32,122 54,118 76,118" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M10,160C30,156 60,158 84,164L80,173C56,169 28,171 10,175Z" fill="#141a24"/>
      <path d="M598,78C609,84 615,93 615,106L607,106C605,96 600,89 592,85Z" fill="url(#tailG)"/>
      <path d="M594,82L612,100" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
      <!-- wheels -->
      <use xlink:href="#wheel" x="118" y="172"/>
      <use xlink:href="#wheel" x="494" y="172"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="860" cy="430" rx="480" ry="260" fill="url(#glow)"/>
  <rect x="0" y="470" width="1200" height="330" fill="url(#floorG)"/>

  <g transform="translate(486,262) scale(1.14)">
    <ellipse cx="308" cy="222" rx="330" ry="16" fill="#0b2a52" opacity=".38" filter="url(#blur6)"/>
    <ellipse cx="118" cy="220" rx="52" ry="6" fill="#06142b" opacity=".6" filter="url(#blur2)"/>
    <ellipse cx="494" cy="220" rx="52" ry="6" fill="#06142b" opacity=".6" filter="url(#blur2)"/>
    <g mask="url(#fadeM)"><use xlink:href="#car" transform="translate(0,438) scale(1,-1)"/></g>
    <use xlink:href="#car"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
